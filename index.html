<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; margin-top: 15px; }
        .logout { background: #dc3545; float: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم المدير العام</h2>
    <p id="adminName" style="font-weight: bold;"></p>
    <hr>
    <p>أهلاً بك في نظام الإدارة والتحكم بالموظفين والشفتات.</p>
    <a href="login.html" class="btn logout" onclick="localStorage.clear()">تسجيل الخروج</a>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (!user || user.role !== 'admin') {
        window.location.href = 'login.html';
    } else {
        document.getElementById('adminName').textContent = `المدير المسجل: ${user.username}`;
    }
</script>

</body>
</html>
