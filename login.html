<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الموحد</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            direction: rtl;
        }

        .login-card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border-color);
        }

        .login-card h2 {
            margin-top: 0;
            text-align: center;
            color: var(--text-main);
            font-size: 22px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-block {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-block:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للنظام</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="login-username" required placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="login-password" required placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="btn-block">دخول</button>
        </form>
    </div>

    <script src="db.js?v=2.0"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            if (!window.db) {
                alert("خطأ: لم يتم الاتصال بقاعدة البيانات. تحقق من ملف db.js");
                return;
            }

            try {
                const { data, error } = await db.from('employees')
                    .select('*')
                    .eq('username', username)
                    .maybeSingle();

                if (error) {
                    alert("خطأ في الاتصال: " + error.message);
                    return;
                }

                if (!data) {
                    alert("اسم المستخدم غير موجود!");
                    return;
                }

                if (data.password_hash !== password) {
                    alert("كلمة المرور غير صحيحة!");
                    return;
                }

                if (data.is_active === false) {
                    alert("هذا الحساب معطل حالياً من قبل الإدارة.");
                    return;
                }

                const sessionData = {
                    id: data.id,
                    username: data.username,
                    full_name: data.full_name,
                    role: data.role,
                    shift_type: data.shift_type,
                    login_time: new Date().getTime()
                };

                if (data.role === 'admin') {
                    localStorage.setItem('admin_session', JSON.stringify(sessionData));
                    window.location.href = 'index.html';
                } else {
                    localStorage.setItem('employee_session', JSON.stringify(sessionData));
                    window.location.href = 'employee.html';
                }

            } catch (err) {
                alert("حدث خطأ غير متوقع: " + err.message);
            }
        }
    </script>
</body>
</html>
